<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Novo Cliente</h2>
    <form th:action="@{/clientes/clientes}" th:object="${cliente}" method="post">
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div class="mb-3">
            <label>Nome</label>
            <input type="text" th:field="*{nome}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>CPF</label>
            <input type="text" th:field="*{cpf}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control"/>
        </div>
        <h5>Endereço</h5>
        <div class="mb-3">
            <label>Logradouro</label>
            <input type="text" th:field="*{endereco.logradouro}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Bairro</label>
            <input type="text" th:field="*{endereco.bairro}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Cidade</label>
            <input type="text" th:field="*{endereco.cidade}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>UF</label>
            <input type="text" th:field="*{endereco.uf}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>CEP</label>
            <input type="text" th:field="*{endereco.cep}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/clientes/clientes}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
