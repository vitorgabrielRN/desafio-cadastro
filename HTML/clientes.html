<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Clientes!</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container mt-5">
    <h1>Lista de Clientes</h1>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="cliente : ${clientes}">
          <td th:text="${cliente.id}"></td>
          <td th:text="${cliente.nome}"></td>
          <td th:text="${cliente.email}"></td>
          <td th:text="${cliente.cpf}"></td>
          <td th:if="${cliente != null}" th:text="${cliente.telefone}"></td>
          <td th:if="${cliente == null}"></td>
          <td>
            <a th:href="@{/Cliente/editar/{id}(id=${cliente.id})}" class="btn btn-primary btn-sm me-2">Atualizar</a>
            <a th:href="@{/Cliente/excluir/{id}(id=${cliente.id})}" class="btn btn-danger btn-sm"
              onclick="return confirm('Quer mesmo apagar?')">Apagar</a>
            <a th:href="@{/faturas/cliente/{clienteId}(clienteId=${cliente.id})}" class="btn btn-info btn-sm mt-1">Ver
              Faturas</a>
          </td>
        </tr>
      </tbody>
    </table>
    <a th:href="@{/Cliente/formulario}" class="btn btn-success">Novo Cliente</a>
    <a th:href="@{/}" class="btn btn-secondary mt-3">Voltar ao Menu Principal</a>
  </div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Editar Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
  <div class="container mt-4">
    <h2>Editar Cliente</h2>
    <form th:action="@{'/clientes/clientes/' + ${cliente.id} + '/editar'}" th:object="${cliente}" method="post">
      <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
      <div class="mb-3">
        <label>Nome</label>
        <input type="text" th:field="*{nome}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>CPF</label>
        <input type="text" th:field="*{cpf}" class="form-control" readonly />
      </div>
      <div class="mb-3">
        <label>Telefone</label>
        <input type="text" th:field="*{telefone}" class="form-control" />
      </div>
      <h5>Endereço</h5>
      <div class="mb-3">
        <label>Logradouro</label>
        <input type="text" th:field="*{endereco.logradouro}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Bairro</label>
        <input type="text" th:field="*{endereco.bairro}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Cidade</label>
        <input type="text" th:field="*{endereco.cidade}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>UF</label>
        <input type="text" th:field="*{endereco.uf}" class="form-control" />
      </div>
      <div class="mb-3">
        <label>CEP</label>
        <input type="text" th:field="*{endereco.cep}" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success">Salvar</button>
      <a th:href="@{/clientes/clientes}" class="btn btn-secondary">Voltar</a>
    </form>
  </div>
</body>

</html>
