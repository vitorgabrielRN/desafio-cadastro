<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gerar Fatura</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Gerar Fatura</h2>
    <form th:action="@{/faturas/gerar}" th:object="${dadosGerar}" method="post">
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div class="mb-3">
            <label>Ano</label>
            <input type="number" th:field="*{ano}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Mês</label>
            <select th:field="*{mes}" class="form-control">
                <option th:each="mes : ${meses}" th:value="${mes.key}" th:text="${mes.value}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label>Cliente</label>
            <select th:field="*{clienteId}" class="form-control">
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Gerar</button>
        <a th:href="@{/faturas}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
