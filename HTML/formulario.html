<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.thymeleaf.org" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Prodiga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" href="#">
</head>

<body class="box">
    <h1>Cadastro de Cliente</h1>

    <form th:action="${cliente.id == null ? '/clientes/salvar' : '/clientes/editar/' + cliente.id}" method="post"
          th:object="${cliente}">
        
        <input type="hidden" th:if="${cliente.id != null}" name="_method" value="put">
        
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" placeholder="Nome completo" th:field="*{nome}">
                <p class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Email" th:field="*{email}">
                <p class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Telefone</label>
                <input type="tel" class="form-control" placeholder="Telefone" th:field="*{telefone}">
                <p class="text-danger" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></p>
            </div>
            
            <div class="col-md-6">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" placeholder="CPF" th:field="*{cpf}">
                <p class="text-danger" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></p>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Endereço</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Logradouro</label>
                        <input type="text" class="form-control" placeholder="Rua/Avenida" th:field="*{endereco.logradouro}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Número</label>
                        <input type="text" class="form-control" placeholder="Nº" th:field="*{endereco.numero}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Complemento</label>
                        <input type="text" class="form-control" placeholder="Complemento" th:field="*{endereco.complemento}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Bairro</label>
                        <input type="text" class="form-control" placeholder="Bairro" th:field="*{endereco.bairro}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control" placeholder="Cidade" th:field="*{endereco.cidade}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">UF</label>
                        <input type="text" class="form-control" placeholder="UF" th:field="*{endereco.uf}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">CEP</label>
                        <input type="text" class="form-control" placeholder="CEP" th:field="*{endereco.cep}">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="submit" class="btn btn-primary me-md-2" 
                    th:text="${cliente.id == null ? 'Cadastrar' : 'Atualizar'}">Cadastrar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</body>
</html>
