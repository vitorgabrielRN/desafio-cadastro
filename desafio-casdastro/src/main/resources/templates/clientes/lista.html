<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Clientes</h1>
    <a th:href="@{/clientes/novo}" class="btn btn-primary mb-3">Novo Cliente</a>
    
    <table class="table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.cpf}"></td>
                <td th:text="${cliente.email}"></td>
                <td>
                    <a th:href="@{/clientes/editar/} + ${cliente.id}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/clientes/excluir/} + ${cliente.id}" class="btn btn-sm btn-danger">Excluir</a>
                    <a th:href="@{/faturas/cliente/} + ${cliente.id}" class="btn btn-sm btn-info">Faturas</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
