<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${clienteId} ? 'Editar Cliente' : 'Novo Cliente'"></h1>
    
    <form th:action="${clienteId} ? 
          @{/clientes/editar/} + ${clienteId} : @{/clientes/salvar}" 
          method="post">
        
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{clienteForm.nome}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" th:field="*{clienteForm.cpf}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{clienteForm.email}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" th:field="*{clienteForm.telefone}" required>
        </div>
        
        <h4 class="mt-4">Endereço</h4>
        
        <div class="mb-3">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" th:field="*{clienteForm.logradouro}" required>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" th:field="*{clienteForm.bairro}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" th:field="*{clienteForm.cep}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" th:field="*{clienteForm.cidade}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">UF</label>
                <input type="text" class="form-control" th:field="*{clienteForm.uf}" maxlength="2" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
