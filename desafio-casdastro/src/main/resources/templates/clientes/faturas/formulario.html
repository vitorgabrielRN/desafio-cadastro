<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerar Fatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Gerar Nova Fatura</h1>
    
    <form th:action="@{/faturas/gerar}" method="post">
        
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{faturaForm.clienteId}" required>
                <option value="">Selecione um cliente</option>
                <option th:each="cliente : ${clientes}" 
                        th:value="${cliente.id}" 
                        th:text="${cliente.nome}"></option>
            </select>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Mês</label>
                <select class="form-select" th:field="*{faturaForm.mes}" required>
                    <option th:each="mes : ${meses}" 
                            th:value="${mes.key}" 
                            th:text="${mes.value}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ano</label>
                <input type="number" class="form-control" th:field="*{faturaForm.ano}" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Gerar Fatura</button>
        <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
