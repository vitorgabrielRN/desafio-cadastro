<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faturas do Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Faturas de <span th:text="${cliente.nome}"></span></h1>
    
    <a th:href="@{/faturas/gerar}" class="btn btn-primary mb-3">Nova Fatura</a>
    <a th:href="@{/clientes}" class="btn btn-secondary mb-3">Voltar</a>
    
    <table class="table">
        <thead>
            <tr>
                <th>Número</th>
                <th>Mês/Ano</th>
                <th>Valor</th>
                <th>Vencimento</th>
                <th>Situação</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fatura : ${faturas}">
                <td th:text="${fatura.numerofatura}"></td>
                <td th:text="${fatura.mes} + '/' + ${fatura.ano}"></td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(fatura.valor, 1, 2)}"></td>
                <td th:text="${#temporals.format(fatura.dataVencimento, 'dd/MM/yyyy')}"></td>
                <td th:text="${fatura.situacao}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
