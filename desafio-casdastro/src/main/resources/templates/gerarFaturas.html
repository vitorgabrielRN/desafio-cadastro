<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Prodiga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body>
    <form th:action="@{/faturas/gerar}" th:object="${dadosGerar}" method="post">
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-control" th:field="*{clienteId}" required>
                <option value="">Selecione um cliente</option>
                <option th:each="cliente : ${clientes}" 
                        th:value="${cliente.id()}"
                        th:text="${cliente.nome()} + ' - ' + ${cliente.cpf()}"></option>
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Ano</label>
            <input type="number" class="form-control" th:field="*{ano}" min="2000" max="2100" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Mês</label>
            <select class="form-control" th:field="*{mes}" required>
                <option value="">Selecione</option>
                <option th:each="entry : ${meses.entrySet()}" 
                        th:value="${entry.key}"
                        th:text="${entry.value}"></option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Gerar</button>
    </form>
</body>
</html>
