<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Prodiga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body>
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Número</th>
                <th>Cliente</th>
                <th>Mês/Ano</th>
                <th>Valor</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fatura : ${faturas}">
                <td th:text="${fatura.numfatura()}"></td>
                <td th:text="${fatura.clienteNome()}"></td>
                <td th:text="${fatura.mes()}/${fatura.ano()}"></td>
                <td th:text="${#numbers.formatCurrency(fatura.valor())}"></td>
                <td th:text="${fatura.situacao()}"></td>
                <td>
                    <a th:href="@{/faturas/{id}/pagamento(id=${fatura.id()})}" 
                       th:if="${fatura.situacao() == T(br.desafio.prodiga.Model.Situacao).GERADA}"
                       class="btn btn-sm btn-success">Pagar</a>
                    <a th:href="@{/faturas/{id}/cancelar(id=${fatura.id()})}" 
                       th:if="${fatura.situacao() == T(br.desafio.prodiga.Model.Situacao).GERADA}"
                       class="btn btn-sm btn-danger">Cancelar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
