<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pagamento de Fatura</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Pagamento de Fatura</h2>
    <form th:action="@{'/faturas/' + ${fatura.id} + '/pagamento'}" th:object="${dadosPagamento}" method="post">
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div class="mb-3">
            <label>Data de Pagamento</label>
            <input type="date" th:field="*{dataPagamento}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-success">Pagar</button>
        <a th:href="@{/faturas}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
